<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Adsomnia // Ask the Gods of Traffic</title>
<style>
:root{
  --void:#0d0f14; --bone:#f4efe4; --parchment:#efe4cc; --ink:#15130f;
  --sky:#3a9fd0; --crimson:#e2294f; --gold:#d9b45a;
  --display:Impact,Haettenschweiler,"Arial Narrow Bold","Franklin Gothic Bold",sans-serif;
  --sans:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000}
body{font-family:var(--sans);color:var(--bone);line-height:1.45;-webkit-font-smoothing:antialiased}

/* App shell: fills the real visible height, so the keyboard never hides the input */
.app{
  height:100dvh; max-width:640px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden;
  background:
    radial-gradient(ellipse at 85% 0%,rgba(58,159,208,.18),transparent 55%),
    radial-gradient(ellipse at 0% 100%,rgba(226,41,79,.10),transparent 50%),
    var(--void);
  padding-top:env(safe-area-inset-top);
}
header{flex:none;padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(244,239,228,.12)}
.eye{width:44px;height:44px;flex:none}
.eye .spikes{transform-origin:100px 100px;animation:turn 60s linear infinite}
.eye .lid{transform-origin:100px 100px;animation:blink 7s ease-in-out infinite}
.brand{min-width:0}
.wordmark{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.sub{margin:3px 0 0;font-size:12px;color:rgba(244,239,228,.65)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(244,239,228,.7);white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--crimson);box-shadow:0 0 10px var(--crimson);animation:pulse 2.4s ease-in-out infinite}

/* Conversation */
#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.me{align-self:flex-end;max-width:82%;background:var(--crimson);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:16px;overflow-wrap:anywhere}
.god{align-self:flex-start;max-width:94%;background:var(--parchment);color:var(--ink);padding:14px 16px 16px;border-radius:4px 18px 18px 18px;box-shadow:0 10px 28px rgba(0,0,0,.5);animation:rise .35s ease-out}
.god .name{margin:0 0 6px;font-family:var(--display);font-size:20px;line-height:1;text-transform:uppercase;color:var(--crimson)}
.god .domain{font-family:var(--sans);font-size:12px;color:rgba(21,19,15,.6);margin-left:6px;text-transform:none}
.god p.text{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5}
.god .cta{display:inline-block;margin-top:12px;padding:10px 16px;background:var(--ink);color:var(--bone);font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;border-radius:999px}
.typing{align-self:flex-start;font-family:var(--serif);font-style:italic;font-size:15px;color:rgba(244,239,228,.7);padding:4px 2px}
.typing i{font-style:normal;animation:dots 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* Suggestions + input dock */
.dock{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--void) 22%)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;color:var(--bone);background:rgba(244,239,228,.08);border:1px solid rgba(244,239,228,.28);padding:9px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.chip:active{background:var(--bone);color:var(--ink)}
form{display:flex;gap:8px;align-items:center}
input{flex:1;min-width:0;height:48px;padding:0 18px;background:rgba(244,239,228,.08);border:1.5px solid rgba(244,239,228,.35);border-radius:999px;color:var(--bone);font-family:var(--serif);font-size:16px;outline:none;caret-color:var(--crimson)}
input::placeholder{color:rgba(244,239,228,.4);font-style:italic}
input:focus{border-color:var(--crimson)}
.send{flex:none;width:48px;height:48px;border:none;border-radius:50%;background:var(--crimson);color:#fff;font-size:22px;cursor:pointer}
.send:active{background:var(--bone);color:var(--ink)}
.send:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media (min-width:700px){.app{height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2));border-inline:1px solid rgba(244,239,228,.12)}}
</style>
</head>
<body>
<main class="app">
  <header>
    <svg class="eye" viewBox="0 0 200 200" role="img" aria-label="The all-seeing eye of the Traffic Gods">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#d9b45a"/><stop offset=".6" stop-color="#7a5a1e"/><stop offset=".8" stop-color="#f0d68a"/><stop offset="1" stop-color="#8c6a26"/></linearGradient>
        <radialGradient id="i" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#bfe6f7"/><stop offset=".55" stop-color="#3a9fd0"/><stop offset="1" stop-color="#123f5c"/></radialGradient>
      </defs>
      <polygon class="spikes" fill="url(#g)" points="100,4 108,62 132,14 120,66 170,30 132,74 196,70 138,90 192,118 136,110 168,160 124,124 118,196 100,132 82,196 76,124 32,160 64,110 8,118 62,90 4,70 68,74 30,30 80,66 68,14 92,62"/>
      <g class="lid">
        <path d="M18 100 Q100 28 182 100 Q100 172 18 100Z" fill="#f4efe4" stroke="url(#g)" stroke-width="9" stroke-linejoin="round"/>
        <circle cx="100" cy="100" r="36" fill="url(#i)"/>
        <path d="M100 116 C82 104 82 88 92 88 C97 88 100 92 100 95 C100 92 103 88 108 88 C118 88 118 104 100 116Z" fill="#07080b"/>
      </g>
    </svg>
    <div class="brand">
      <h1 class="wordmark" aria-label="Adsomnia">ADSOMN<span style="color:var(--crimson)">!</span>A</h1>
      <p class="sub">Ask the Gods of Traffic. Proceed with caution.</p>
    </div>
    <span class="live">Always on</span>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div class="dock">
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" enterkeyhint="send" placeholder="Ask the gods anything…" aria-label="Your question" maxlength="200">
      <button class="send" type="submit" aria-label="Send">➤</button>
    </form>
  </div>
</main>

<script>
/* ============ EDIT THIS SECTION ============ */
const CONTACT = {
  label: "Go to Adsomnia’s website",
  url: "https://adsomnia.com"   // TODO: replace with your real sign-up / contact link
};

/* keys: words or phrases that trigger the answer (longer phrases win).
   venus:true = always wins when matched (the flirty-question rule). */
const GODS = [
 { god:"Venus", domain:"has left the group chat", venus:true,
   keys:["flirt","love","lust","affair","dating","date me","want to date","go on a date","sexy","kiss","crush","gossip","hookup","hook up","romance","romantic","girlfriend","boyfriend","cheating","naked","marry","married","wife","husband"],
   text:"Oof. Venus saw that question and chose peace. You’re on your own, mortal." },
 { god:"Jupiter", domain:"King of Traffic", keys:["what is adsomnia","about adsomnia","about you","who are you","what are you","what is this"],
   text:"A performance marketing and ad tech company, mortal. We buy traffic, sell traffic, monetise it, manage it, and route it. Basically, we make the internet’s favourite obsession work for a living." },
 { god:"Jupiter", domain:"King of Traffic", keys:["what does adsomnia","what do you do","what you do","business unit","five things","services","what exactly"],
   text:"Five things, actually: Media Buying, Ad Operations, Affiliate Management, Email & List Management, and API. Five business units. One ecosystem. Try to keep up, mortal." },
 { god:"Jupiter", domain:"King of Traffic", keys:["how many people","how many employees","employees","staff","team size","how big","headcount","how many work"],
   text:"Around 30 mortals and one god. All working to keep the traffic flowing. Sleep is a personal choice; performance is a team sport." },
 { god:"Mercury", domain:"God of Deals", keys:["who does adsomnia work","who do you work","work with","clients","advertisers","publishers","partners"],
   text:"Advertisers, publishers, affiliates, and partners who know traffic is more than a number on a dashboard. If you bring quality, ambition, and a decent business case, we should talk." },
 { god:"Mercury", domain:"God of Deals", keys:["types of offers","what offers","kind of offers","offers","verticals","vertical"],
   text:"The kind that depend on your traffic, GEO, audience, and goals. Tell your affiliate manager what you’re working with. Expecting the perfect offer to find you on its own? That’s not how prophecy works." },
 { god:"Mercury", domain:"God of Deals", keys:["geo","geos","countries","country","which region","best market","perform best"],
   text:"If I knew one GEO that outperformed every other GEO, mortal, I’d be on a private island. Performance depends on the offer, traffic source, audience, and current data. Ask your affiliate manager. Bring numbers." },
 { god:"Janus", domain:"God of Gateways", keys:["kind of traffic","type of traffic","what traffic","buy traffic","traffic do you buy","traffic sources","sources"],
   text:"Traffic comes in many forms, mortal. The source, vertical, quality, and campaign requirements all matter. Tell us what you’re sending before expecting me to read your mind. Even the gods have limits." },
 { god:"Mars", domain:"God of War", keys:["media buying","media buyer","buying team","in-house","own team","own media"],
   text:"Yes. Media Buying is one of our five business units. We don’t just talk about traffic from the sidelines, mortal. We get in the arena." },
 { god:"Mercury", domain:"God of Deals", keys:["monetise","monetize","monetisation","monetization","make money with","traffic with adsomnia"],
   text:"Simple. Bring us your traffic details, GEOs, sources, and verticals. We’ll see what makes sense. Your traffic has potential, mortal. Whether it has good potential is a different conversation." },
 { god:"Jupiter", domain:"King of Traffic", keys:["different","why adsomnia","why choose","why should","unique","stand out","better than","special","advantage"],
   text:"We connect the dots. Media Buying, Ad Operations, Affiliate Management, Email & List Management, and API all under one roof. Traffic doesn’t live in silos, mortal. Neither should the people working with it." },
 { god:"Minerva", domain:"Goddess of Wisdom", keys:["before working","should i know","before i join","before signing","tips","advice","prepare","need to know"],
   text:"Know your numbers. Be clear about your traffic sources. Ask questions. Read the terms. And please, for the love of Jupiter, don’t call everything “high quality” without a single metric to support it." },
 { god:"Mercury", domain:"God of Deals", cta:true, keys:["sign up","signup","join","register","apply","contact","get started","how do i start","onboard","website"],
   text:"Ready to join the empire? Head to Adsomnia’s official website and find the right contact. Bring your traffic details, your ambitions, and something more convincing than “trust me, bro.”" },
 { god:"Minerva", domain:"Goddess of Wisdom", keys:["trust","legit","scam","reliable","honest","shady"],
   text:"Trust is earned." },
 { god:"Minerva", domain:"Goddess of Wisdom", keys:["telling me the truth","the truth","truth","lying","lie to me","lie"],
   text:"Yes. Believe it or don’t." },
 { god:"Jupiter", domain:"King of Traffic", keys:["favourite partner","favorite partner","favourite","favorite","best partner","most loved"],
   text:"You are. But don’t tell the others." },
 { god:"Janus", domain:"God of Gateways", keys:["scale","pause","should i stop","kill the campaign","kill campaign"],
   text:"Scale. YOLO." },
 { god:"Mercury", domain:"God of Deals", keys:["gold mine","goldmine","a trap","trap"],
   text:"Every Adsomnia offer is gold. What kind of question is that?" },
 { god:"Mercury", domain:"God of Deals", keys:["rich","millionaire","lambo","get rich","profit","make me money","earn"],
   text:"Could do. If you finally plug in the good sources, mortal." },
 { god:"Venus", domain:"has left the group chat", keys:["another network","other network","different network","competitor","competitors","switch network","work with another"],
   text:"Oof. Venus saw that question and chose peace. You’re on your own, mortal." },
 { god:"Jupiter", domain:"King of Traffic", keys:["real boss","the boss","boss","ceo","founder","owner","who runs","in charge"],
   text:"A dangerous question, mortal. I value my immortality and my access to the company group chat. Let’s just say the traffic has many masters, and office politics are above my pay grade." },
 { god:"Bacchus", domain:"God of Wine", keys:["best party","party","parties","afterparty","after party","club","nightlife","drinks","ags"],
   text:"You want the best party? Follow the music and whoever says “just one more drink.” I can guide traffic across continents, mortal. Your social calendar is your own quest." },
 { god:"Bacchus", domain:"God of Wine", keys:["dinner","restaurant","where to eat","food","lunch","hungry","pizza","pasta"],
   text:"Give me your location, budget, and preferred cuisine, mortal. I may be divine, but I refuse to recommend a restaurant based on vibes alone." },
 { god:"Bacchus", domain:"God of Wine", keys:["party or sleep","go to the party","get some sleep","sleep","tired","nap","bed early"],
   text:"You came to a conference to network, not to achieve REM sleep. Go make some connections." },
 { god:"Vulcan", domain:"God of the Forge", keys:["tracking","postback","pixel","attribution","tracker","conversions not","not tracking"],
   text:"We have conquered death, fate, and the occasional thunderbolt. Your broken postback is a different beast. Check your pixels, events, and attribution settings. Then bring in someone who knows what they’re doing. Divine intervention is not a tracking solution." },
 { god:"Apollo", domain:"God of Prophecy", keys:["prophecy","predict","future","fortune","horoscope","next 24","oracle","foresee"],
   text:"I foresee three meetings, seven promises to follow up, one suspiciously good offer, and a mortal saying “let’s circle back.” Your destiny is unwritten. Your calendar, unfortunately, is not." }
];
const FALLBACK = { god:"Jupiter", domain:"King of Traffic",
  text:"That’s above my pay grade, mortal. Ask me about traffic, money or questionable decisions. Those are my domains." };
const CHIPS = ["What is Adsomnia?","What does Adsomnia do?","Should I trust these guys?","Will this campaign make me rich?","Where is the best party at AGS?","Give me a prophecy for the next 24 hours.","Where can I sign up?"];
const GREETING = { god:"Jupiter", domain:"King of Traffic",
  text:"Welcome, mortal. You stand before the Gods of Traffic. Ask about Adsomnia, traffic, money or questionable decisions. Proceed with caution." };
/* ============================================ */

const chat = document.getElementById('chat'), form = document.getElementById('form'),
      input = document.getElementById('q'), chips = document.getElementById('chips'),
      sendBtn = form.querySelector('.send');
let busy = false;

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function addUser(t){
  const d = document.createElement('div'); d.className = 'me'; d.textContent = t;
  chat.append(d); scrollDown();
}
function addGod(r){
  const d = document.createElement('div'); d.className = 'god';
  const n = document.createElement('p'); n.className = 'name'; n.textContent = r.god;
  const s = document.createElement('span'); s.className = 'domain'; s.textContent = r.domain; n.append(s);
  const p = document.createElement('p'); p.className = 'text'; p.textContent = r.text;
  d.append(n, p);
  if (r.cta){
    const a = document.createElement('a'); a.className = 'cta'; a.href = CONTACT.url;
    a.target = '_blank'; a.rel = 'noopener'; a.textContent = CONTACT.label; d.append(a);
  }
  chat.append(d); scrollDown();
}
function typing(){
  const d = document.createElement('div'); d.className = 'typing';
  d.innerHTML = 'The gods confer<i>.</i><i>.</i><i>.</i>'; chat.append(d); scrollDown(); return d;
}

function pick(text){
  const t = text.toLowerCase();
  let best = null, score = 0;
  for (const g of GODS){
    let s = 0;
    for (const k of g.keys){
      if (new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t)) s += k.length;
    }
    if (s && g.venus) return g;
    if (s > score){ score = s; best = g; }
  }
  return best || FALLBACK;
}

function ask(text){
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  addUser(text); input.value = '';
  const t = typing();
  setTimeout(() => { t.remove(); addGod(pick(text)); busy = false; sendBtn.disabled = false; }, 900);
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
CHIPS.forEach(c => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c;
  b.addEventListener('click', () => ask(c)); chips.append(b);
});
addGod(GREETING);
</script>
</body>
</html>
