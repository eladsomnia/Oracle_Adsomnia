<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Adsomnia // The Oracle Never Sleeps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#f4efe4; --parchment:#efe4cc; --ink:#15130f;
  --green:#5be13b; --green-deep:#176b0a; --gold:#d9b45a;
  --display:"Anton",Impact,Haettenschweiler,"Arial Narrow Bold","Franklin Gothic Bold",sans-serif;
  --sans:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000}
body{font-family:var(--sans);color:#fff;line-height:1.45;-webkit-font-smoothing:antialiased}

/* App shell: fills the real visible height, so the keyboard never hides the input */
.app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#000;padding-top:env(safe-area-inset-top)}

/* Header */
header{flex:none;padding:12px 14px 0}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wordmark{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,9.8vw,56px);line-height:.98;text-transform:uppercase;color:#fff}
.tag{margin:0 0 4px;font:800 11px/1.05 var(--sans);letter-spacing:.01em;text-transform:uppercase;text-align:right;color:#fff}
.mini{display:none;height:52px}
.rule{display:none;height:1px;background:#4a4a4a;margin-top:10px}
.chatting .tag{display:none}
.chatting .mini{display:block}
.chatting .bar{align-items:center}
.chatting .rule{display:block}

.eye-holder svg,.eye-holder img{display:block;height:100%;width:auto}

/* Start screen */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px}
.chatting .hero{display:none}
.hero .big{position:relative;z-index:2;height:min(34dvh,290px);min-height:120px}
.title{position:relative;z-index:1;display:block;width:100%;max-width:520px;margin-top:-7dvh}
.title text{font-family:var(--display);font-size:70px;fill:#fff}
.lead{margin:2.2dvh 0 0;text-align:center;color:var(--green);font:800 clamp(10.5px,2.9vw,16px)/1.25 var(--sans);letter-spacing:-.01em;text-transform:uppercase}

/* Conversation */
#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.app:not(.chatting) #chat{display:none}
.me{align-self:flex-end;max-width:82%;background:var(--green);color:#000;font-weight:600;padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:16px;overflow-wrap:anywhere;animation:rise .25s ease-out}
.god{align-self:flex-start;max-width:94%;background:var(--parchment);color:var(--ink);padding:14px 16px 16px;border-radius:4px 18px 18px 18px;box-shadow:0 10px 28px rgba(0,0,0,.6);animation:rise .35s ease-out}
.god .name{margin:0 0 6px;font-family:var(--display);font-size:21px;line-height:1;text-transform:uppercase;color:var(--green-deep)}
.god .domain{font-family:var(--sans);font-size:12px;color:rgba(21,19,15,.6);margin-left:6px;text-transform:none}
.god p.text{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5}
.god .cta{display:inline-block;margin-top:12px;padding:10px 16px;background:var(--ink);color:var(--bone);font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;border-radius:999px}
.typing{align-self:flex-start;font-family:var(--serif);font-style:italic;font-size:15px;color:rgba(255,255,255,.65);padding:4px 2px}
.typing i{font-style:normal;animation:dots 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* Chips + input */
.dock{flex:none;padding:8px 14px calc(12px + env(safe-area-inset-bottom));background:#000}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:15px;color:#fff;background:#121212;border:1px solid #3d3d3d;padding:11px 16px;border-radius:999px;min-height:44px;cursor:pointer}
.chip:active{background:#fff;color:#000}
form{display:flex;gap:8px;align-items:center}
input{flex:1;min-width:0;height:52px;padding:0 20px;background:#121212;border:1.5px solid #444;border-radius:999px;color:#fff;font-family:var(--serif);font-size:16px;outline:none;caret-color:var(--green)}
input::placeholder{color:rgba(255,255,255,.4);font-style:italic}
input:focus{border-color:var(--green)}
.send{flex:none;width:52px;height:52px;border:none;border-radius:50%;background:var(--green);color:#fff;font-size:24px;cursor:pointer}
.send:active{background:#fff;color:#000}
.send:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media (min-width:700px){.app{height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2));border-inline:1px solid #222}}
</style>
</head>
<body>
<main class="app" id="app">
  <header>
    <div class="bar">
      <h1 class="wordmark" aria-label="Adsomnia">ADSOMN!A</h1>
      <p class="tag">Ask the gods of traffic<br>Proceed with caution!</p>
      <div class="eye-holder mini"><img class="eye" alt="" width="42" height="52"></div>
    </div>
    <div class="rule"></div>
  </header>

  <section class="hero">
    <div class="eye-holder big"><img class="eye" alt="The all-seeing eye of the Gods of Traffic" width="280" height="350"></div>
    <svg class="title" viewBox="0 0 390 124" role="img" aria-label="The oracle never sleeps">
      <text x="25" y="58" textLength="340" lengthAdjust="spacingAndGlyphs">THE ORACLE</text>
      <text x="9" y="114" textLength="372" lengthAdjust="spacingAndGlyphs">NEVER SLEEPS</text>
    </svg>
    <p class="lead">Ask the gods of traffic about Adsomnia, traffic,<br>business, or your questionable life decisions.</p>
  </section>

  <div id="chat" aria-live="polite"></div>

  <div class="dock">
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" enterkeyhint="send" placeholder="Ask the gods anything…" aria-label="Your question" maxlength="200">
      <button class="send" type="submit" aria-label="Send">➤</button>
    </form>
  </div>
</main>

/* keys: words or phrases that trigger the answer (longer phrases win).

 { god:"Mercury", domain:"God of Deals",

 { god:"Mars", domain:"God of War",
   keys:["media buying","media buyer","buying team","in-house","own team","own media"],
   text:"Yes." },
 { god:"Jupiter", domain:"King of Traffic",
   keys:["different","why adsomnia","why choose","why should","unique","stand out","better than","special","advantage"],
   text:"Five units under one roof. We do it all in-house and we have standards we need to keep. Guess you gotta run first and see for yourself." },
 { god:"Minerva", domain:"Goddess of Wisdom",
   keys:["before working","should i know","before i join","before signing","tips","advice","prepare","need to know"],
   text:"Know your numbers and be ready to share them." },
 { god:"Mercury", domain:"God of Deals", cta:true,
   keys:["sign up","signup","join","register","apply","contact","get started","how do i start","onboard","website"],
   text:"Click here:" },
 { god:"Minerva", domain:"Goddess of Wisdom",
   keys:["trust","legit","scam","reliable","honest","shady"],
   text:"Yes." },
 { god:"Minerva", domain:"Goddess of Wisdom",
   keys:["telling me the truth","the truth","truth","lying","lie to me","lie"],
   text:"Always." },
 { god:"Jupiter", domain:"King of Traffic",
   keys:["favourite partner","favorite partner","favourite","favorite","best partner","most loved"],
   text:"You." },
 { god:"Janus", domain:"God of Gateways",
   keys:["scale","pause","should i stop","kill the campaign","kill campaign"],
   text:"Scale. YOLO. The gods accept no responsibility." },

   keys:["rich","millionaire","lambo","get rich","profit","make me money","earn"],
   text:"Maybe. If you finally plug in the good sources." },
 { god:"Venus", domain:"has left the group chat",
   keys:["another network","other network","different network","competitor","competitors","switch network","work with another"],
   text:"Venus read that and left. You’re on your own." },
 { god:"Jupiter", domain:"King of Traffic",
   keys:["real boss","the boss","boss","ceo","founder","owner","who runs","in charge"],
   text:"Dangerous question. I like my immortality. Next." },
 { god:"Bacchus", domain:"God of Wine",
   keys:["best party","party","parties","afterparty","after party","club","nightlife","drinks","ags"],
   text:"Just follow the Adsomnia people. They’re the life of the party." },
 { god:"Bacchus", domain:"God of Wine",
   keys:["dinner","restaurant","where to eat","food","lunch","hungry","pizza","pasta"],
   text:"Head to Trastevere and you’ll find a bunch of great restaurants there." },
 { god:"Bacchus", domain:"God of Wine",
   keys:["party or sleep","go to the party","get some sleep","sleep","tired","nap","bed early"],
   text:"Traffic never sleeps. Neither should you. Go." },
 { god:"Apollo", domain:"God of Prophecy",
   keys:["prophecy","predict","future","fortune","horoscope","next 24","oracle","foresee"],
   text:"I see a beer in your hand. Your future is bright." }
];
const FALLBACK = { god:"Jupiter", domain:"King of Traffic",
  text:"Tough question. I don’t feel like thinking. Ask something else." };
const CHIPS = ["What is Adsomnia?","What does Adsomnia do?","Should I trust these guys?","Will this campaign make me rich?","Where is the best party at AGS?","Give me a prophecy for the next 24 hours.","Where can I sign up?"];
const GREETINGS = [
  "Ah, a new mortal. Bold of you to scan that QR code. Ask us about Adsomnia, traffic or questionable decisions."
].map(text => ({ god:"Jupiter", domain:"King of Traffic", text }));
/* ============================================ */

const app = document.getElementById('app'), chat = document.getElementById('chat'),
      form = document.getElementById('form'), input = document.getElementById('q'),
      chips = document.getElementById('chips'), sendBtn = form.querySelector('.send');
let busy = false, started = false;

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function addUser(t){
  const d = document.createElement('div'); d.className = 'me'; d.textContent = t;
  chat.append(d); scrollDown();
}
function addGod(r){
  const d = document.createElement('div'); d.className = 'god';
  const n = document.createElement('p'); n.className = 'name'; n.textContent = r.god;
  const s = document.createElement('span'); s.className = 'domain'; s.textContent = r.domain; n.append(s);
  const p = document.createElement('p'); p.className = 'text'; p.textContent = r.text;
  d.append(n, p);
  if (r.cta){
    const a = document.createElement('a'); a.className = 'cta'; a.href = CONTACT.url;
    a.target = '_blank'; a.rel = 'noopener'; a.textContent = CONTACT.label; d.append(a);
  }
  chat.append(d); scrollDown();
}
function typing(){
  const d = document.createElement('div'); d.className = 'typing';
  d.innerHTML = 'The gods confer<i>.</i><i>.</i><i>.</i>'; chat.append(d); scrollDown(); return d;
}

function pick(text){
  const t = text.toLowerCase();
  let best = null, score = 0;
  for (const g of GODS){
    let s = 0;
    for (const k of g.keys){
      if (new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t)) s += k.length;
    }
    if (s && g.venus) return g;
    if (s > score){ score = s; best = g; }
  }
  return best || FALLBACK;
}

function ask(text){
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  if (!started){ started = true; app.classList.add('chatting'); }   // start screen -> chat screen
  addUser(text); input.value = '';
  const t = typing();
  setTimeout(() => { t.remove(); addGod(pick(text)); busy = false; sendBtn.disabled = false; }, 900);
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
CHIPS.forEach(c => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c;
  b.addEventListener('click', () => ask(c)); chips.append(b);
});
